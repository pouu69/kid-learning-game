version: 1
frontend:
  phases:
    preBuild:
      commands:
        - npm install terser
    build:
      commands:
        # Copy static files to dist/
        - mkdir -p dist/css
        - cp sw.js numbers.html manifest.json icon.svg dist/
        - cp css/*.css dist/css/

        # Concatenate all JS files in load order → single bundle
        - |
          cat \
            js/curriculum.js \
            js/storage.js \
            js/pet.js \
            js/effects.js \
            js/world.js \
            js/renderer.js \
            js/sprites.js \
            js/utils.js \
            js/learning.js \
            js/activities/meet.js \
            js/activities/sound-match.js \
            js/activities/letter-hunt.js \
            js/activities/syllable-factory.js \
            js/activities/word-games.js \
            js/activities/sentence-builder.js \
            js/activities/play.js \
            js/activities/care.js \
            js/minigames/ball-bounce.js \
            js/report.js \
            js/story/Constants.js \
            js/story/EventBus.js \
            js/story/Utils.js \
            js/story/TimeSystem.js \
            js/story/WeatherSystem.js \
            js/story/SeasonSystem.js \
            js/story/VisitorSystem.js \
            js/story/ExploreSystem.js \
            js/story/WorldRenderer.js \
            js/story/StoryEngine.js \
            js/game.js \
            > dist/app.bundle.js

        # Minify the bundle
        - npx terser dist/app.bundle.js --compress passes=2,pure_getters=true --mangle --output dist/app.min.js
        - rm dist/app.bundle.js

        # Rewrite index.html to use single bundle
        - python3 build.py
  artifacts:
    baseDirectory: dist
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
customHeaders:
  - pattern: '/sw.js'
    headers:
      - key: 'Cache-Control'
        value: 'no-cache, no-store, must-revalidate'
  - pattern: '/index.html'
    headers:
      - key: 'Cache-Control'
        value: 'no-cache, must-revalidate'
  - pattern: '/numbers.html'
    headers:
      - key: 'Cache-Control'
        value: 'no-cache, must-revalidate'
  - pattern: '/manifest.json'
    headers:
      - key: 'Cache-Control'
        value: 'no-cache, must-revalidate'
