<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#1a1830">
    <meta name="mobile-web-app-capable" content="yes">
    <title>타마고지</title>
    <link href="https://cdn.jsdelivr.net/npm/dunggeunmo-font/dunggeunmo.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700&display=swap" rel="stylesheet">
    <style>@font-face { font-family: 'DungGeunMo'; src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_six@1.2/DungGeunMo.woff') format('woff'); font-weight: normal; font-style: normal; font-display: swap; }</style>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="manifest" href="manifest.json">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><text y='28' font-size='28'>&#128049;</text></svg>">
</head>
<body>

    <!-- NAMING SCREEN -->
    <div id="namingScreen" class="screen active">
        <div class="naming-inner">
            <div class="naming-title">말 배우는 펫</div>
            <div class="naming-subtitle">친구의 이름을 지어주세요</div>
            <div class="naming-egg" aria-hidden="true"></div>
            <input
                type="text"
                id="nameInput"
                class="naming-input"
                placeholder="이름"
                maxlength="6"
                autocomplete="off"
                autocorrect="off"
                spellcheck="false"
            >
            <button class="btn-primary" onclick="submitName()">시작하기</button>
        </div>
    </div>

    <!-- HOME SCREEN -->
    <div id="homeScreen" class="screen">
        <!-- Floating header -->
        <div class="home-header">
            <div class="pet-info pixel-panel" id="petInfo">
                <span class="pixel-star">&#9733;</span>
                <span class="pet-name" id="petNameLabel"></span>
                <span class="pet-level" id="petStageLabel"></span>
                <div class="evo-progress" id="evoProgress">
                    <div class="evo-progress-bar" id="evoProgressBar"></div>
                </div>
                <span class="evo-next" id="evoNextLabel"></span>
            </div>
        </div>

        <!-- Pixel stat bars -->
        <div class="stat-gauges pixel-panel" id="statGauges">
            <div class="stat-bar">
                <span class="stat-icon" style="color: var(--red);">&#9829;</span>
                <div class="stat-bar-track"><div class="stat-bar-fill stat-fill-hunger" id="fillHunger"></div></div>
            </div>
            <div class="stat-bar">
                <span class="stat-icon" style="color: var(--orange);">&#9786;</span>
                <div class="stat-bar-track"><div class="stat-bar-fill stat-fill-mood" id="fillMood"></div></div>
            </div>
            <div class="stat-bar">
                <span class="stat-icon" style="color: var(--purple);">&#9790;</span>
                <div class="stat-bar-track"><div class="stat-bar-fill stat-fill-sleepy" id="fillSleepy"></div></div>
            </div>
        </div>

        <!-- World canvas (PixiJS renders here) -->
        <div class="world-canvas" id="worldCanvas"></div>

        <!-- Pixel care bar at bottom -->
        <div class="care-bar" id="homeActions">
            <button class="care-btn" data-action="feed">
                <div class="care-icon care-icon-feed">&#9829;</div>
                <span>밥</span>
            </button>
            <button class="care-btn" data-action="sleep">
                <div class="care-icon care-icon-sleep">&#9790;</div>
                <span>잠</span>
            </button>
            <button class="care-btn" data-action="wash">
                <div class="care-icon care-icon-wash">&#9697;</div>
                <span>씻기</span>
            </button>
            <button class="care-btn care-btn-learn" data-action="learn">
                <div class="care-icon care-icon-learn">ㄱ</div>
                <span>배우기</span>
            </button>
        </div>
    </div>

    <!-- LEARNING SCREEN -->
    <div id="learningScreen" class="screen">
        <div class="learning-header">
            <button class="btn-back" onclick="exitLearning()">&#8592; 돌아가기</button>
            <div class="progress-dots" id="progressDots"></div>
        </div>
        <div class="learning-content" id="learningContent"></div>
        <div class="mini-pet" id="miniPet"></div>
    </div>

    <!-- REPORT SCREEN (hidden, 3sec long press on pet-info) -->
    <div id="reportScreen" class="screen hidden">
        <div class="report-header pixel-panel">
            <span class="report-title">학습 리포트</span>
            <button class="btn-back" onclick="showScreen('home')">&#8592; 닫기</button>
        </div>
        <div class="report-content" id="reportContent"></div>
    </div>

    <!-- Pixel wipe transition overlay -->
    <div id="pixelWipe" class="pixel-wipe"></div>

    <!-- Scripts: load order matters, no modules -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pixi.js/8.6.6/pixi.min.js"></script>
    <script src="js/curriculum.js"></script>
    <script src="js/storage.js"></script>
    <script src="js/pet.js"></script>
    <script src="js/effects.js"></script>
    <script src="js/world.js"></script>
    <script src="js/renderer.js"></script>
    <script src="js/sprites.js"></script>
    <script src="js/learning.js"></script>
    <script src="js/activities/meet.js"></script>
    <script src="js/activities/sound-match.js"></script>
    <script src="js/activities/letter-hunt.js"></script>
    <script src="js/activities/syllable-factory.js"></script>
    <script src="js/activities/play.js"></script>
    <script src="js/activities/care.js"></script>
    <script src="js/report.js"></script>
    <!-- Story System -->
    <script src="js/story/Constants.js"></script>
    <script src="js/story/EventBus.js"></script>
    <script src="js/story/Utils.js"></script>
    <script src="js/story/TimeSystem.js"></script>
    <script src="js/story/WeatherSystem.js"></script>
    <script src="js/story/SeasonSystem.js"></script>
    <script src="js/story/VisitorSystem.js"></script>
    <script src="js/story/ExploreSystem.js"></script>
    <script src="js/story/WorldRenderer.js"></script>
    <script src="js/story/StoryEngine.js"></script>
    <script src="js/game.js"></script>
    <script>
    // ── Inline bootstrap ──────────────────────────────────────────────────────

    // Fix mobile viewport height (address bar issue)
    function setVH() {
        var vh = window.innerHeight * 0.01;
        document.documentElement.style.setProperty('--vh', vh + 'px');
    }
    setVH();
    window.addEventListener('resize', setVH);
    window.addEventListener('orientationchange', function () { setTimeout(setVH, 100); });

    // showScreen is defined in game.js (tracks currentScreen state)

    // Naming screen submit
    function submitName() {
        var input = document.getElementById('nameInput');
        var name = (input ? input.value : '').trim();
        if (typeof setName === 'function') {
            setName(name);
        }
    }

    // Home action — triggered by PixiJS need bubble or DOM click
    function handleActionClick() {
        if (typeof Pet !== 'undefined' && typeof getState === 'function') {
            var btn = Pet.getActionButton(getState());
            if (btn && typeof handleAction === 'function') {
                handleAction(btn.action);
            }
        }
    }

    // Learning back button — instant return to home, pet walks in
    function exitLearning() {
        // Close any open learning popup first (closePopup handles screen transition automatically)
        if (typeof Learning !== 'undefined' && Learning.closePopup) {
            Learning.closePopup();
        }
        // Ensure home screen is active and HUD is refreshed
        if (typeof currentScreen !== 'undefined' && currentScreen !== 'home') {
            showScreen('home');
            if (typeof PetRenderer !== 'undefined') {
                if (PetRenderer.container) PetRenderer.container.visible = true;
                if (PetRenderer.walkOnScreen) PetRenderer.walkOnScreen('left');
            }
        }
        var s = typeof getState === 'function' ? getState() : null;
        if (s && typeof updateHome === 'function') updateHome(s);
    }

    // Long press (3 seconds) on .pet-info opens report screen
    (function () {
        var pressTimer = null;
        var THRESHOLD = 3000;

        function startPress(e) {
            pressTimer = setTimeout(function () {
                pressTimer = null;
                if (typeof renderReport === 'function' && typeof getState === 'function') renderReport(getState());
                showScreen('report');
            }, THRESHOLD);
        }

        function cancelPress() {
            if (pressTimer) {
                clearTimeout(pressTimer);
                pressTimer = null;
            }
        }

        document.addEventListener('DOMContentLoaded', function () {
            var petInfo = document.getElementById('petInfo');
            if (petInfo) {
                petInfo.addEventListener('touchstart', startPress, { passive: true });
                petInfo.addEventListener('touchend', cancelPress);
                petInfo.addEventListener('touchcancel', cancelPress);
                petInfo.addEventListener('mousedown', startPress);
                petInfo.addEventListener('mouseup', cancelPress);
                petInfo.addEventListener('mouseleave', cancelPress);
            }
        });
    })();

    // World canvas touch → pet interaction
    document.addEventListener('DOMContentLoaded', function () {
        if (typeof initGame === 'function') initGame();

        // Care bar: 이벤트 위임 (인라인 onclick 제거)
        var careBar = document.getElementById('homeActions');
        if (careBar) {
            careBar.addEventListener('click', function(e) {
                var btn = e.target.closest('[data-action]');
                if (btn && typeof handleAction === 'function') {
                    handleAction(btn.dataset.action);
                }
            });
        }

        var worldCanvas = document.getElementById('worldCanvas');
        if (worldCanvas) {
            worldCanvas.addEventListener('click', function(e) {
                if (e.target.tagName === 'BUTTON') return;
                if (typeof PetRenderer !== 'undefined' && (PetRenderer._isDragging || PetRenderer._physicsMode)) return;
                if (typeof handleAction === 'function') {
                    handleAction('pet');
                }
            });
        }
    });
    </script>
</body>
</html>
