<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#fdf8f0">
    <meta name="mobile-web-app-capable" content="yes">
    <title>타마고지</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&family=Noto+Sans+KR:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
    <link rel="manifest" href="manifest.json">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><text y='28' font-size='28'>&#128049;</text></svg>">
</head>
<body>

    <!-- NAMING SCREEN -->
    <div id="namingScreen" class="screen active">
        <div class="naming-inner">
            <div class="naming-title">말 배우는 펫</div>
            <div class="naming-subtitle">친구의 이름을 지어주세요</div>
            <div class="naming-egg" aria-hidden="true"></div>
            <input
                type="text"
                id="nameInput"
                class="naming-input"
                placeholder="이름"
                maxlength="6"
                autocomplete="off"
                autocorrect="off"
                spellcheck="false"
            >
            <button class="btn-primary" onclick="submitName()">시작하기</button>
        </div>
    </div>

    <!-- HOME SCREEN -->
    <div id="homeScreen" class="screen">
        <!-- Floating header -->
        <div class="home-header">
            <div class="pet-info glass" id="petInfo">
                <span class="pet-name" id="petNameLabel"></span>
                <span class="pet-stage" id="petStageLabel"></span>
            </div>
            <div class="stat-icons" id="statIcons">
                <div class="stat-icon glass">
                    <span style="color:#f08080;font-size:0.85rem;">&#9829;</span>
                    <div class="stat-minibar">
                        <div class="stat-fill" id="fillHunger" style="background:#f08080;width:100%;"></div>
                    </div>
                </div>
                <div class="stat-icon glass">
                    <span style="color:#f4b870;font-size:0.85rem;">&#9786;</span>
                    <div class="stat-minibar">
                        <div class="stat-fill" id="fillMood" style="background:#f4b870;width:100%;"></div>
                    </div>
                </div>
                <div class="stat-icon glass">
                    <span style="color:#c8a0d8;font-size:0.85rem;">&#9789;</span>
                    <div class="stat-minibar">
                        <div class="stat-fill" id="fillSleepy" style="background:#c8a0d8;width:100%;"></div>
                    </div>
                </div>
            </div>
        </div>

        <!-- World canvas (PixiJS renders here) -->
        <div class="world-canvas" id="worldCanvas"></div>

        <!-- Speech bubble -->
        <div class="speech-bubble hidden" id="speechBubble"></div>

        <!-- Pet hint finger (shows when idle, PixiJS handles need bubbles) -->
        <div class="pet-hint" id="petHint">
            <div class="pet-hint-finger"></div>
        </div>
    </div>

    <!-- LEARNING SCREEN -->
    <div id="learningScreen" class="screen">
        <div class="learning-header">
            <button class="btn-back glass" onclick="exitLearning()">&#8592; 돌아가기</button>
            <div class="progress-dots" id="progressDots"></div>
        </div>
        <div class="learning-content" id="learningContent"></div>
        <div class="mini-pet" id="miniPet"></div>
    </div>

    <!-- REWARD SCREEN -->
    <div id="rewardScreen" class="screen">
        <div class="reward-inner">
            <div class="reward-pet-bounce" id="rewardPet"></div>
            <div class="reward-word" id="rewardWord"></div>
            <div class="reward-message" id="rewardMessage"></div>
            <div class="reward-content" id="rewardContent"></div>
            <button class="btn-primary" id="rewardBtn" onclick="exitLearning()">홈으로</button>
        </div>
    </div>

    <!-- REPORT SCREEN (hidden, 3sec long press on pet-info) -->
    <div id="reportScreen" class="screen hidden">
        <div class="report-header glass">
            <span class="report-title">학습 리포트</span>
            <button class="btn-back glass" onclick="showScreen('home')">&#8592; 닫기</button>
        </div>
        <div class="report-content" id="reportContent"></div>
    </div>

    <!-- Scripts: load order matters, no modules -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pixi.js/8.6.6/pixi.min.js"></script>
    <script src="js/curriculum.js"></script>
    <script src="js/storage.js"></script>
    <script src="js/pet.js"></script>
    <script src="js/effects.js"></script>
    <script src="js/world.js"></script>
    <script src="js/renderer.js"></script>
    <script src="js/sprites.js"></script>
    <script src="js/learning.js"></script>
    <script src="js/activities/meet.js"></script>
    <script src="js/activities/discover.js"></script>
    <script src="js/activities/play.js"></script>
    <script src="js/activities/reunite.js"></script>
    <script src="js/report.js"></script>
    <script src="js/game.js"></script>
    <script>
    // ── Inline bootstrap ──────────────────────────────────────────────────────

    // Fix mobile viewport height (address bar issue)
    function setVH() {
        var vh = window.innerHeight * 0.01;
        document.documentElement.style.setProperty('--vh', vh + 'px');
    }
    setVH();
    window.addEventListener('resize', setVH);
    window.addEventListener('orientationchange', function () { setTimeout(setVH, 100); });

    // showScreen is defined in game.js (tracks currentScreen state)

    // Naming screen submit
    function submitName() {
        var input = document.getElementById('nameInput');
        var name = (input ? input.value : '').trim();
        if (typeof setName === 'function') {
            setName(name);
        }
    }

    // Home action — triggered by PixiJS need bubble or DOM click
    function handleActionClick() {
        if (typeof Pet !== 'undefined' && typeof getState === 'function') {
            var btn = Pet.getActionButton(getState());
            if (btn && typeof handleAction === 'function') {
                handleAction(btn.action);
            }
        }
    }

    // Learning back button
    function exitLearning() {
        showScreen('home');
    }

    // Long press (3 seconds) on .pet-info opens report screen
    (function () {
        var pressTimer = null;
        var THRESHOLD = 3000;

        function startPress(e) {
            pressTimer = setTimeout(function () {
                pressTimer = null;
                if (typeof renderReport === 'function' && typeof getState === 'function') renderReport(getState());
                showScreen('report');
            }, THRESHOLD);
        }

        function cancelPress() {
            if (pressTimer) {
                clearTimeout(pressTimer);
                pressTimer = null;
            }
        }

        document.addEventListener('DOMContentLoaded', function () {
            var petInfo = document.getElementById('petInfo');
            if (petInfo) {
                petInfo.addEventListener('touchstart', startPress, { passive: true });
                petInfo.addEventListener('touchend', cancelPress);
                petInfo.addEventListener('touchcancel', cancelPress);
                petInfo.addEventListener('mousedown', startPress);
                petInfo.addEventListener('mouseup', cancelPress);
                petInfo.addEventListener('mouseleave', cancelPress);
            }
        });
    })();

    // World canvas touch → pet interaction
    document.addEventListener('DOMContentLoaded', function () {
        if (typeof initGame === 'function') initGame();

        var worldCanvas = document.getElementById('worldCanvas');
        if (worldCanvas) {
            worldCanvas.addEventListener('click', function(e) {
                // Don't trigger if clicking a button
                if (e.target.tagName === 'BUTTON') return;
                if (typeof handleAction === 'function') {
                    handleAction('pet');
                }
            });
        }
    });
    </script>
</body>
</html>
